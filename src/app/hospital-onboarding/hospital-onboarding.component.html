<div class="hospital-onboarding-container">
  <h2>Hospital Onboarding</h2>
  <form [formGroup]="hospitalForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Hospital Name<span class="required">*</span></label>
      <input id="name" formControlName="name" type="text" class="form-control" required />
      <div *ngIf="submitted && hospitalForm.controls['name'].errors" class="error">
        Hospital name is required.
      </div>
    </div>
    <div class="form-group">
      <label for="address">Address</label>
      <input id="address" formControlName="address" type="text" class="form-control" />
    </div>
    <div class="form-group">
      <label for="contactNumber">Contact Number</label>
      <input id="contactNumber" formControlName="contactNumber" type="text" class="form-control" />
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>
