                            <div class="row">
                                <div class="col-12">
                                    <div class="form-heading">
                                        <h4>Appointment Details</h4>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                        <label for="Date">Date of Appointment <span
                                                class="login-danger">*</span></label>
                                        <input class="form-control  datetimepicker" formControlName="date" type="text"
                                            matInput [matDatepicker]="picker" (dateChange)="onDobDateChange($event)">
                                        <mat-datepicker #picker></mat-datepicker>
                                        <mat-datepicker-toggle matIconSuffix [for]="
                                                picker"></mat-datepicker-toggle>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                      <label for="AppointTime">Appointment Time <span class="login-danger">*</span></label>
                                      <timepicker [(ngModel)]="bookappointment.value.appointTime"
                                                  formControlName="appointTime" 
                                                  [showMeridian]="true" [hourStep]="1" [minuteStep]="1"></timepicker>
                                      <div *ngIf="bookappointment.get('appointTime')?.invalid && (bookappointment.get('appointTime')?.dirty || bookappointment.get('appointTime')?.touched)"
                                          class="text-danger">
                                        <div *ngIf="bookappointment.get('appointTime')?.errors?.['required']">
                                          Appointment Time is required.
                                        </div>
                                      </div>
                                    </div>
                                  </div>

                                <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                        <label for="Consulting">Department<span
                                            class="login-danger">*</span></label>
                                        <mat-select formControlName="departmentId" class="form-control select"
                                            placeholder="Select Department" (selectionChange)="loadDoctorData($event)">
                                            <mat-option *ngFor="let data of departmentList" [value]="data.departmentId">
                                                {{data.displayName || data.departmentName}}
                                            </mat-option>
                                        </mat-select>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                        <label for="Consulting">Consulting Doctor<span
                                            class="login-danger">*</span></label>
                                        <mat-select formControlName="doctorId" formControlName="doctorId"
                                            class="form-control select" placeholder="Select Doctor"
                                            (selectionChange)="addFee($event)">
                                            <mat-option *ngFor="let data of doctorList" [value]="data.staffId">
                                                {{data.firstName}} {{data.lastName}}
                                            </mat-option>
                                        </mat-select>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                        <label for="Consulting">Appointment Status<span
                                            class="login-danger">*</span></label>
                                        <mat-select formControlName="doctorId" formControlName="appointmentStatus"
                                            class="form-control select" placeholder="Appointment Status">
                                            <mat-option *ngFor="let data of appointmentStatusData" [value]="data.value">
                                                {{data.value}}
                                            </mat-option>
                                        </mat-select>
                                    </div>
                                </div>


                                

                                <div class="col-12 col-sm-12">
                                    <div class="form-group local-forms">
                                        <label for="Notes">Notes <span class="login-danger">*</span></label>
                                        <textarea class="form-control" formControlName="notes" rows="3"
                                            cols="30"></textarea>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="doctor-submit text-end">
                                        <button type="submit" class="btn btn-primary submit-form me-2">Submit</button>
                                        <button type="submit" class="btn btn-primary cancel-form"
                                            (click)="navigation()">Cancel</button>
                                    </div>
                                </div>
                            </div>
                            <!-- </div>

        <div class="row">
            <div class="col-12">
                <div class="card">

                        <div class="col-12 col-md-6 col-xl-6">
                            <div class="form-group local-top-form">
                                <label for="Avatar" class="local-top">Upload documents <span
                                        class="login-danger">*</span></label>
                                <div class="settings-btn upload-files-avator">
                                    <input type="file" class="hide-input" id="file" (change)=onFileSelected($event)>
                                    <button for="file" type="submit" class="upload">Upload
                                        File</button>

                                </div>

                            </div>
                        </div>
                    </div>
