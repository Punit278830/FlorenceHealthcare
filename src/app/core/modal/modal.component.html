<div class="modal fade delete-modal" [ngClass]="{'show': isVisible}" [ngStyle]="{'display': isVisible ? 'block' : 'none'}" role="dialog"> 
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center">
                <img src="assets/img/sent.png" alt="" width="50" height="46">
                <h3>Are you sure you want to delete this {{ modalData?.type }}?</h3>
                <div class="m-t-20">
                    <button class="btn btn-white me-1" (click)="closeModal()">Close</button>
                    <button type="submit" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>
