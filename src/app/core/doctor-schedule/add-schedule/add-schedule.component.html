<div class="page-wrapper">
    <div class="content">
    
        <!-- Page Header -->
        <div class="page-header">
            <div class="row">
                <div class="col-sm-12">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a [routerLink]="routes.schedule">Doctor Shedule </a></li>
                        <li class="breadcrumb-item"><i class="feather icon-chevron-right"></i></li>
                        <li class="breadcrumb-item active">Add Schedule</li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- /Page Header -->
        <div class="container">
            <div class="col-sm-12">
            
                <div class="card">
                    <div class="card-body">
                        <!-- Form starts here -->
<form [formGroup]="form">
  <div class="row">
    <div class="col-12">
      <div class="form-heading">
        <h4>Add Schedule</h4>
      </div>
    </div>

    <!-- Doctor and Department -->
    <div class="col-12 col-md-6">
      <div class="form-group local-forms">
        <label>Doctor Name <span class="login-danger">*</span></label>
        <input class="form-control" type="text" />
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="form-group local-forms">
        <label>Department <span class="login-danger">*</span></label>
        <mat-select
          [(ngModel)]="selectedValue"
          [ngModelOptions]="{ standalone: true }"
          class="form-control select"
          placeholder="Choose Department"
        >
          <mat-option *ngFor="let data of selectedList" [value]="data.value">
            {{ data.value }}
          </mat-option>
        </mat-select>
      </div>
    </div>

    <!-- Time fields on the left -->
    <div class="col-md-8">
      <div class="row">
        <div class="col-12 col-md-4">
          <div class="form-group local-forms">
            <label>Available Days <span class="login-danger">*</span></label>
            <input
              class="form-control datetimepicker"
              matInput
              [matDatepicker]="picker"
              [min]="minDate"
              formControlName="date"
              type="text"
            />
            <mat-datepicker #picker></mat-datepicker>
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="form-group local-forms">
            <label>From <span class="login-danger">*</span></label>
            <input type="time" class="form-control" formControlName="fromTime" />
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="form-group local-forms">
            <label>To <span class="login-danger">*</span></label>
            <input type="time" class="form-control" formControlName="toTime" />
          </div>
          <div class="d-flex justify-content-end mt-2">
            <button type="button" class="btn btn-outline-primary" (click)="addSlot()">Add Slot</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notes on the right -->
    <div class="col-md-4">
      <div class="form-group local-forms">
        <label>Notes <span class="login-danger">*</span></label>
        <textarea
          class="form-control"
          rows="6"
          [(ngModel)]="notes"
          [ngModelOptions]="{ standalone: true }"
        ></textarea>
      </div>
    </div>

    <!-- Status -->
    <div class="col-md-6">
      <div class="form-group select-gender">
        <label>Status <span class="login-danger">*</span></label>
        <div class="form-check-inline">
          <label class="form-check-label">
            <input
              type="radio"
              name="status"
              class="form-check-input"
              value="Active"
              (change)="setStatus('Active')"
              [checked]="status === 'Active'"
            />
            Active
          </label>
        </div>
        <div class="form-check-inline">
          <label class="form-check-label">
            <input
              type="radio"
              name="status"
              class="form-check-input"
              value="Inactive"
              (change)="setStatus('Inactive')"
              [checked]="status === 'Inactive'"
            />
            Inactive
          </label>
        </div>
      </div>
    </div>
     <div *ngIf="availableSlots.length > 0" class="mt-4">
                        <h5>Available Slots</h5>
                        <ul class="list-group">
                            <li class="list-group-item" *ngFor="let slot of availableSlots">
                            📅 {{ slot.date | date:'EEE MMM dd yyyy' }} | 🕒 {{ slot.from }} - {{ slot.to }}
                            

                            </li>
                        </ul>
                        </div>

    <!-- Buttons -->
    <div class="col-12">
      <div class="doctor-submit text-end">
        <button
          type="button"
          class="btn btn-primary submit-form me-2"
          (click)="saveSchedule()"
        >
          Create Schedule
        </button>
        <button type="reset" class="btn btn-primary cancel-form">Cancel</button>
      </div>
    </div>
  </div>
</form>

                       

                    </div>
                </div>							
            </div>					
        </div>
    </div>
</div>
