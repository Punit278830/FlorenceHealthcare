<div class="page-wrapper">
    <div class="content">

        <!-- Page Header -->
        <div class="page-header">
            <div class="row">
                <div class="col-sm-12">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a [routerLink]="routes.schedule">Doctor Shedule </a></li>
                        <li class="breadcrumb-item"><i class="feather icon-chevron-right"></i></li>
                        <li class="breadcrumb-item active">Edit Schedule</li>
                    </ul>
                </div>
            </div>
        </div>
        <!-- /Page Header -->
        <div class="row">
            <div class="col-sm-12">

                <div class="card">
                    <div class="card-body">
                        <form [formGroup]="schedule" (ngSubmit)="UpdateStaffScheduleInfo(schedule)">
                            <div class="row">
                                <div class="col-12">
                                    <div class="form-heading">
                                        <h4>Edit Schedule</h4>
                                    </div>
                                </div>
                                <!-- <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                        <label for="doctor">Doctor Name <span class="login-danger">*</span></label>
                                        <input class="form-control" type="text" formControlName="">
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-6">
                                    <div class="form-group local-forms">
                                        <label for="department">Department <span class="login-danger">*</span></label>
                                        <mat-select [(ngModel)]="selectedValue" [ngModelOptions]="{standalone: true}"
                                            class="form-control select" placeholder="Choose Department">
                                            <mat-option *ngFor="let data of selectedList" [value]="data.value">
                                                {{data.value}}
                                            </mat-option>
                                        </mat-select>
                                    </div>
                                </div> -->
                                <div class="col-12 col-md-6 col-xl-4">
                                    <div class="form-group local-forms">
                                        <label for="available">Off Day <span class="login-danger">*</span></label>
                                        <input class="form-control datetimepicker" type="text"
                                            formControlName="scheduleDate" matInput [matDatepicker]="picker" [min]="date">
                                        <mat-datepicker #picker></mat-datepicker>
                                        <mat-datepicker-toggle matIconSuffix [for]="picker" ></mat-datepicker-toggle>
                                        <div *ngIf="schedule.get('scheduleDate')?.invalid && (schedule.get('scheduleDate')?.dirty || schedule.get('scheduleDate')?.touched)"
                                            class="text-danger">
                                            <div *ngIf="schedule.get('scheduleDate')?.errors?.['required']">
                                                Schedule date is required.</div>
                                        </div>
                                    </div>
                                </div>
                                <ng-container *ngIf="!leaveCheckBoxStatus">
                                    <div class="col-12 col-md-4 col-xl-1">
                                        <div class="form-group local-forms">
                                            <label for="Consulting">From</label>
                                            <mat-select class="form-control select" formControlName="fromTime"
                                                placeholder="From">
                                                <mat-option *ngFor="let data of DayTime" [value]="data">
                                                    {{data}}
                                                </mat-option>
                                            </mat-select>
                                            <div *ngIf="schedule.get('fromTime')?.invalid && (schedule.get('fromTime')?.dirty || schedule.get('fromTime')?.touched)"
                                                class="text-danger">
                                                <div *ngIf="schedule.get('fromTime')?.errors?.['required']">From
                                                    time is required.</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-4 col-xl-1">
                                        <div class="form-group local-forms">
                                            <label for="Consulting">AM/PM</label>
                                            <mat-select class="form-control select" formControlName="fromPostfix">
                                                <mat-option *ngFor="let data of postFix" [value]="data">
                                                    {{data}}
                                                </mat-option>
                                            </mat-select>
                                            <div *ngIf="schedule.get('fromPostfix')?.invalid && (schedule.get('fromPostfix')?.dirty || schedule.get('fromPostfix')?.touched)"
                                                class="text-danger">
                                                <div *ngIf="schedule.get('fromPostfix')?.errors?.['required']">From
                                                    AM/PM is required.</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-6 col-xl-1">
                                        <div class="form-group local-forms">
                                            <label for="Consulting">To</label>
                                            <mat-select class="form-control select" formControlName="toTime"
                                                placeholder="To">
                                                <mat-option *ngFor="let data of DayTime" [value]="data">
                                                    {{data}}
                                                </mat-option>
                                            </mat-select>
                                            <div *ngIf="schedule.get('toTime')?.invalid && (schedule.get('toTime')?.dirty || schedule.get('toTime')?.touched)"
                                                class="text-danger">
                                                <div *ngIf="schedule.get('toTime')?.errors?.['required']">To time
                                                    is required.</div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="col-12 col-md-4 col-xl-1">
                                        <div class="form-group local-forms">
                                            <label for="Consulting">AM/PM</label>
                                            <mat-select class="form-control select" formControlName="toPostfix">
                                                <mat-option *ngFor="let data of postFix" [value]="data">
                                                    {{data}}
                                                </mat-option>
                                            </mat-select>
                                            <div *ngIf="schedule.get('toPostfix')?.invalid && (schedule.get('toPostfix')?.dirty || schedule.get('toPostfix')?.touched)"
                                                class="text-danger">
                                                <div *ngIf="schedule.get('toPostfix')?.errors?.['required']">To
                                                    AM/PM is required.</div>
                                            </div>
                                        </div>
                                    </div>
                                </ng-container>

                                <div class="col-12 col-sm-12">
                                    <div class="form-group local-forms">
                                        <label for="Notes">Notes <span class="login-danger">*</span></label>
                                        <textarea class="form-control" formControlName="notes" rows="3"
                                            cols="30"></textarea>
                                        <div *ngIf="schedule.get('notes')?.invalid && (schedule.get('notes')?.dirty || schedule.get('notes')?.touched)"
                                            class="text-danger">
                                            <div *ngIf="schedule.get('notes')?.errors?.['required']">Notes are
                                                required.</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-12">
                                    <div class="form-group" style="border: 1px solid lightgray;border-radius: 20px;padding: 6px 10px;width: 25rem;">
                                        <label for="Notes">Status <span class="login-danger">*</span></label>
                                        <mat-select formControlName="status" placeholder="Select Status"
                                            (selectionChange)="onStatusChange($event)">
                                            <mat-option *ngFor="let option of statusOptions" [value]="option.value">{{
                                                option.label }}</mat-option>
                                        </mat-select>
                                    </div>
                                </div>






                                <div class="col-12">
                                    <div class="doctor-submit text-end">
                                        <button type="submit" class="btn btn-primary submit-form me-2">Submit</button>
                                        <button [routerLink]="routes.schedule"
                                            class="btn btn-primary cancel-form">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
