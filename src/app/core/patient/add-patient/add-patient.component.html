<div class="page-wrapper">
    <div class="content">

        <!-- Page Header -->
        <div class="page-header">
            <div class="row">
                <div class="col-sm-12">
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a [routerLink]="routes.patientsList">Patients </a></li>
                        <li class="breadcrumb-item"><i class="feather icon-chevron-right"></i></li>
                        <li class="breadcrumb-item active">Add Patient</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-12">

                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-4">
                                    <div class="form-group local-forms">
                                        <label for="name">First Name <span class="login-danger">*</span></label>
                                        <input class="form-control" formControlName="firstName" type="text"
                                            placeholder="">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6 col-xl-4">
                                    <div class="form-group local-forms">
                                        <label for="last">Last Name <span class="login-danger">*</span></label>
                                        <input class="form-control" formControlName="lastName" type="text"
                                            placeholder="">
                                    </div>
                                </div>

                                </div> -->
                                <div class="col-12 col-md-6 col-xl-4">
                                    <div class="form-group local-forms">
                                        <label for="Birth">Date Of Birth <span class="login-danger">*</span></label>
                                        <input class="form-control datetimepicker"
                                            (dateChange)="onDobDateChange($event)" placeholder="MM/DD/YYYY" type="text" formControlName="dob"
                                            matInput [matDatepicker]="dob">
                                        <mat-datepicker #dob></mat-datepicker>
                                        <mat-datepicker-toggle matIconSuffix [for]="dob"></mat-datepicker-toggle>
                                    </div>
                                </div>

                                        <label for="mobile">Mobile <span class="login-danger">*</span></label>
                                        <input class="form-control" formControlName="mobile" type="text" placeholder="">
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 col-xl-4">
                                    <div class="form-group local-forms">
                                        <label for="email">Email </label>
                                        <input class="form-control" formControlName="email" type="email" placeholder="">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6 col-xl-4">
                                    <div class="form-group local-forms">
                                        <label for="department">Gender <span class="login-danger">*</span></label>
                                        <mat-select formControlName="gender" class="form-control select">
