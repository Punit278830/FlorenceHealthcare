<div class="container mt-3">
  <h3 class="mb-3">Hospital Onboarding</h3>

  <div class="row">
    <div class="col-md-6">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Name *</label>
            <input type="text" class="form-control" formControlName="name" />
          </div>
          <div class="col-6">
            <label class="form-label">Code</label>
            <input type="text" class="form-control" formControlName="code" />
          </div>
          <div class="col-6">
            <label class="form-label">Registration Number</label>
            <input type="text" class="form-control" formControlName="registrationNumber" />
          </div>
          <div class="col-6">
            <label class="form-label">GSTIN</label>
            <input type="text" class="form-control" formControlName="gstin" />
          </div>
          <div class="col-6">
            <label class="form-label">Website</label>
            <input type="text" class="form-control" formControlName="websiteUrl" />
          </div>
          <div class="col-6">
            <label class="form-label">Contact Person</label>
            <input type="text" class="form-control" formControlName="contactPerson" />
          </div>
          <div class="col-6">
            <label class="form-label">Contact Number</label>
            <input type="text" class="form-control" formControlName="contactNumber" />
          </div>
          <div class="col-12">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" formControlName="email" />
          </div>

          <div class="col-12">
            <label class="form-label">Address Line 1</label>
            <input type="text" class="form-control" formControlName="addressLine1" />
          </div>
          <div class="col-12">
            <label class="form-label">Address Line 2</label>
            <input type="text" class="form-control" formControlName="addressLine2" />
          </div>
          <div class="col-4">
            <label class="form-label">City</label>
            <input type="text" class="form-control" formControlName="city" />
          </div>
          <div class="col-4">
            <label class="form-label">State</label>
            <input type="text" class="form-control" formControlName="state" />
          </div>
          <div class="col-4">
            <label class="form-label">Pincode</label>
            <input type="text" class="form-control" formControlName="pincode" />
          </div>
          <div class="col-6">
            <label class="form-label">Country</label>
            <input type="text" class="form-control" formControlName="country" />
          </div>
          <div class="col-6">
            <label class="form-label">Logo URL</label>
            <input type="text" class="form-control" formControlName="logoUrl" />
          </div>
          <div class="col-12 form-check mt-2">
            <input class="form-check-input" type="checkbox" formControlName="isActive" id="isActive" />
            <label class="form-check-label" for="isActive"> Active </label>
          </div>

          <div class="col-12">
            <button class="btn btn-primary" [disabled]="loading" type="submit">Create</button>
          </div>
        </div>
      </form>

      <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
      <div *ngIf="success" class="alert alert-success mt-3">{{ success }}</div>
    </div>

    <div class="col-md-6">
      <h5>Hospitals</h5>
      <div class="list-group">
        <button type="button" class="list-group-item list-group-item-action" *ngFor="let h of hospitals" (click)="selectHospital(h)">
          <div class="d-flex w-100 justify-content-between">
            <h6 class="mb-1">{{ h.name }}</h6>
            <small>Id: {{ h.hospitalId }}</small>
          </div>
          <p class="mb-1">{{ h.city || '' }} {{ h.state || '' }}</p>
          <small>{{ h.email || '' }}</small>
        </button>
      </div>
    </div>
  </div>
</div>
